on:
  push:
    branches:
    - default
    paths:
    - images/Containerfile.devcontainer
  image_version:
    names:
    - ltex-ls-plus
    - texlive
    - rust
  workflow_dispatch:
jobs:
  build_push:
    uses: ./.github/workflows/build+push.yml
    with:
      image: devcontainer
      containerfile: ./images/Containerfile.devcontainer
permissions:
  contents: read
  packages: write
