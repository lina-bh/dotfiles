on:
  push:
    branches:
    - default
    paths:
    - images/Containerfile.texlive
  workflow_dispatch:
jobs:
  build_push:
    uses: ./.github/workflows/build+push.yml
    with:
      image: texlive
      containerfile: ./images/Containerfile.texlive
permissions:
  contents: read
  packages: write
