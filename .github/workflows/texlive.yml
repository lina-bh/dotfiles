on:
  push:
    branches:
    - default
    paths:
    - images/Containerfile.texlive
    - .github/workflows/build_push.yml
    - .github/workflows/texlive.yml
  workflow_dispatch:
jobs:
  build_push:
    uses: ./.github/workflows/build_push.yml
    with:
      image: texlive
      containerfile: ./images/Containerfile.texlive
    permissions:
      contents: read
      packages: write
